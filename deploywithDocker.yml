- hosts: all
  become: true

  tasks:

    - name: login to jfrog
      shell: docker login -u test -p Test@12345 trialtypobk.jfrog.io

    - name: pull an image
      shell: docker pull trialtypobk.jfrog.io/dockerbhargav/sampledockeruplaod:v1.0-{{ build_number }}

    - name: run container
      shell: docker run -d -p 8082:8080 trialtypobk.jfrog.io/dockerbhargav/sampledockeruplaod:v1.0-{{ build_number }}
